<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Asset Fields - Vul-Management
    </title>

    <link
        rel="stylesheet"
        href="../styles/main.css"
    >

</head>


<body>

    <main class="page-container">

        <section class="page-header">

            <div>

                <h1>
                    Asset Field Configuration
                </h1>

                <p>
                    Configure the fields used by asset management.
                </p>

            </div>


            <div class="table-actions">
                <label class="form-field inline-field">
                    <select id="asset-type-selector">
                        <option value="equipment">Equipment</option>
                        <option value="operating_system">Operating Systems</option>
                        <option value="application">Applications</option>
                        <option value="library">Libraries</option>
                    </select>
                </label>

                <button
                    id="add-field-button"
                    class="primary-button"
                    type="button"
                >
                    Add Custom Field
                </button>
            </div>

        </section>


        <section class="content-card">

            <div class="section-header">

                <div>

                    <h2 id="asset-fields-section-title">
                        Equipment Fields
                    </h2>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>Label</th>

                            <th>
                                Key
                            </th>

                            <th>
                                Required
                            </th>

                            <th>
                                Visible
                            </th>

                            <th>
                                System
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="fields-table-body">

                    </tbody>

                </table>

            </div>

        </section>


        <div
            id="field-modal"
            class="modal-overlay"
            aria-hidden="true"
        >
            <div
                class="modal-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="field-form-title"
            >
                <div class="modal-header">
                    <div>
                        <h2 id="field-form-title">Add Custom Field</h2>
                        <p class="section-description">
                            Define the field name and its behavior.
                        </p>
                    </div>

                    <button
                        type="button"
                        id="close-field-modal"
                        class="modal-close-button"
                        aria-label="Close"
                    >
                        &times;
                    </button>
                </div>

                <form id="field-form">
                    <div class="form-grid field-form-grid">
                        <div class="form-field form-full-width">
                            <label for="field_label">Field Name *</label>
                            <input
                                id="field_label"
                                type="text"
                                required
                                placeholder="Example: Rack Number"
                            >
                        </div>

                        <div class="field-checkbox-group">
                            <label class="checkbox-card">
                                <input id="field_required" type="checkbox">
                                <span>
                                    <strong>Required</strong>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input id="field_visible" type="checkbox" checked>
                                <span>
                                    <strong>Visible</strong>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-button">
                            Save Field
                        </button>

                        <button
                            type="button"
                            id="cancel-field-button"
                            class="secondary-button"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>


    <script src="../services/api.js"></script>

    <script src="../services/asset-fields.js"></script>

    <script src="../services/sidebar.js"></script>

</body>

</html>
