<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Status - Vul-Management</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        .progress-shell { margin:24px 0; }
        .progress-track { height:22px; background:#e9ecef; border-radius:12px; overflow:hidden; }
        .progress-bar { height:100%; width:0%; transition:width .3s ease; background:#0d6efd; }
        .status-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
        .status-value { font-size:24px; font-weight:700; }
        .status-label { color:#6c757d; font-size:13px; }
        .running { color:#0d6efd; } .completed { color:#198754; } .failed { color:#dc3545; }
        @media(max-width:800px){ .status-grid{grid-template-columns:repeat(2,1fr);} }
    </style>
</head>
<body>
<main class="page-container">
    <section class="page-header">
        <div>
            <h1>Synchronization Status</h1>
            <p>Live status for CPE extraction, NVD discovery and CISA KEV synchronization jobs.</p>
        </div>
        <a class="secondary-button" href="vulnerabilities.html">Back to Vulnerabilities</a>
    </section>

    <section class="content-card">
        <div class="status-grid">
            <div><div class="status-label">Status</div><div id="job-status" class="status-value">-</div></div>
            <div><div class="status-label">Progress</div><div id="job-progress-text" class="status-value">0%</div></div>
            <div><div class="status-label">Processed</div><div id="job-processed" class="status-value">0 / 0</div></div>
            <div><div class="status-label">Job</div><div id="job-type" class="status-value">-</div></div>
        </div>
        <div class="progress-shell">
            <div class="progress-track"><div id="job-progress-bar" class="progress-bar"></div></div>
        </div>
        <p id="job-step" class="section-description">Waiting...</p>
        <div id="job-error" class="error-cell"></div>
    </section>

    <section class="content-card">
        <div class="section-header"><h2>Recent Sync Jobs</h2></div>
        <div class="table-container">
            <table>
                <thead><tr><th>Job</th><th>Type</th><th>Status</th><th>Progress</th><th>Started</th><th>Finished</th></tr></thead>
                <tbody id="jobs-table-body"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="../services/api.js"></script>
<script>
let selectedJob = new URLSearchParams(window.location.search).get("job");
let timer = null;

function esc(v) {
    const e = document.createElement("div");
    e.textContent = v ?? "";
    return e.innerHTML;
}

function renderJob(job) {
    document.getElementById("job-status").textContent = job.status || "-";
    document.getElementById("job-status").className = "status-value " + (job.status || "");
    document.getElementById("job-progress-text").textContent = (job.progress ?? 0) + "%";
    document.getElementById("job-progress-bar").style.width = (job.progress ?? 0) + "%";
    document.getElementById("job-processed").textContent = (job.processed ?? 0) + " / " + (job.total ?? 0);
    document.getElementById("job-type").textContent = job.job_type || "-";
    document.getElementById("job-step").textContent = job.current_step || "Waiting...";
    document.getElementById("job-error").textContent = job.error_message || "";
}

async function loadJobs() {
    const result = await apiRequest("/api/sync-jobs");
    const jobs = result.items || [];
    document.getElementById("jobs-table-body").innerHTML = jobs.map(job =>
        "<tr><td>" + job.id + "</td><td>" + esc(job.job_type) + "</td><td>" + esc(job.status) +
        "</td><td>" + (job.progress ?? 0) + "%</td><td>" + esc(job.started_at || "-") +
        "</td><td>" + esc(job.finished_at || "-") + "</td></tr>"
    ).join("");
    if (!selectedJob && jobs.length) selectedJob = String(jobs[0].id);
}

async function poll() {
    try {
        if (selectedJob) {
            const job = await apiRequest("/api/sync-jobs/" + selectedJob);
            renderJob(job);
            if (job.status === "completed" || job.status === "failed" || job.status === "cancelled") {
                clearInterval(timer);
            }
        }
        await loadJobs();
    } catch (error) {
        document.getElementById("job-error").textContent = error.message;
    }
}

poll();
timer = setInterval(poll, 1000);
</script>
<script src="../services/sidebar.js"></script>
</body>
</html>
