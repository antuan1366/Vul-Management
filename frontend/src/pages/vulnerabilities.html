<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Results - Vul-Management</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<main class="page-container">
    <section class="page-header">
        <div>
            <h1>Scan Results</h1>
            <p>Vulnerability findings discovered by scans and reviewed against your asset inventory.</p>
        </div>
    </section>

    <section class="content-card">
        <div class="section-header">
            <div>
                <h2>Scan Results</h2>
                <p class="section-description">Review scan findings, confirm applicability, and approve or reject pending candidates.</p>
            </div>
            <div id="finding-count" class="item-count">0 Findings</div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>CVE</th>
                        <th>Asset</th>
                        <th>Severity</th>
                        <th>CVSS</th>
                        <th>Applicability</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="findings-table-body"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="../services/api.js"></script>
<script src="../services/vulnerabilities.js"></script>
<script src="../services/sidebar.js"></script>
</body>
</html>
