<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Vul-Management</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-brand-mark">V</div>
        <p class="auth-eyebrow">VULNERABILITY MANAGEMENT PLATFORM</p>
        <h1>Sign in</h1>
        <p class="auth-subtitle">Sign in with your Vul-Management account to continue.</p>
        <form id="login-form" class="auth-form" autocomplete="on">
            <div class="form-field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username"
                    minlength="3" maxlength="64" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    maxlength="128" required>
            </div>
            <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
            <button id="login-button" class="primary-button auth-submit" type="submit">Sign in</button>
        </form>
        <p class="auth-footnote">Access is limited to authorized accounts.</p>
    </main>
    <script src="../services/api.js"></script>
    <script src="../services/auth-pages.js"></script>
</body>
</html>
