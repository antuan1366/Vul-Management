<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerability Scans - Vul-Management</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        .page-header-actions { display:flex; gap:10px; align-items:center; }
        .scan-card { margin-bottom:20px; }
        .schedule-form { display:flex; gap:12px; align-items:end; }
        .schedule-form label { display:flex; flex-direction:column; gap:6px; font-size:13px; min-width:260px; }
        .schedule-form select { min-height:38px; }
        .scan-message { margin-top:14px; }
        .status-badge { display:inline-flex; padding:4px 9px; border-radius:999px; font-size:12px; font-weight:600; }
        .status-running,.status-pending { background:#fff3cd; color:#664d03; }
        .status-completed { background:#d1e7dd; color:#0f5132; }
        .status-failed { background:#f8d7da; color:#842029; }
    </style>
</head>
<body>
<main class="page-container">
    <section class="page-header">
        <div>
            <h1>Vulnerability Scans</h1>
            <p>Start vulnerability discovery against the current asset inventory and review scan execution results here.</p>
        </div>
        <div class="page-header-actions">
            <button id="scan-now-button" class="primary-button" type="button">Scan Now</button>
            <button id="sync-kev-button" class="secondary-button" type="button">Update CISA KEV</button>
        </div>
    </section>

    <section class="content-card">

        <div class="section-header">
            <div>
                <h2>Scan Results</h2>
                <p class="section-description">Complete scan execution history and result summaries.</p>
            </div>
            <div id="scan-count" class="item-count">0 Scans</div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Scan ID</th>
                        <th>Started</th>
                        <th>Finished</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Current Step</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="scan-results-body"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="../services/api.js"></script>
<script src="../services/scan.js"></script>
<script src="../services/sidebar.js"></script>
</body>
</html>
