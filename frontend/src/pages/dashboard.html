<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dashboard - Vul-Management
    </title>

    <link
        rel="stylesheet"
        href="../styles/main.css"
    >

</head>


<body>

    <main class="page-container">

        <section class="page-header">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Vulnerability Management Platform
                </p>

            </div>

        </section>


        <section class="dashboard-grid">

            <div class="dashboard-card">

                <span class="card-title">
                    Assets
                </span>

                <strong id="asset-count">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span class="card-title">
                    Vulnerabilities
                </span>

                <strong id="vulnerability-count">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span class="card-title">
                    Critical
                </span>

                <strong id="critical-count">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span class="card-title">
                    High
                </span>

                <strong id="high-count">
                    0
                </strong>

            </div>

        </section>

    </main>


    <script src="../services/api.js"></script>

    <script src="../services/sidebar.js"></script>

</body>

</html>
